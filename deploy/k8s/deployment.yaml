apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-meter
  labels:
    app.kubernetes.io/name: cluster-meter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cluster-meter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cluster-meter
    spec:
      serviceAccountName: cluster-meter
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cluster-meter
          image: docker.io/kuberpull/cluster-meter:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HOME
              value: /tmp
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cluster-meter-secrets
                  key: GEMINI_API_KEY
                  optional: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
