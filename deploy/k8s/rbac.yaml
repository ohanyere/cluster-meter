apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-meter
  labels:
    app.kubernetes.io/name: cluster-meter
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-meter-read
  labels:
    app.kubernetes.io/name: cluster-meter
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - namespaces
      - resourcequotas
      - limitranges
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-meter-read
  labels:
    app.kubernetes.io/name: cluster-meter
subjects:
  - kind: ServiceAccount
    name: cluster-meter
    namespace: cluster-meter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-meter-read
