name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.CONTAINER_REGISTRY }}/${{ secrets.CONTAINER_REGISTRY_USERNAME }}/${{ secrets.CONTAINER_IMAGE }}

jobs:
  validate-go:
    name: Validate Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  validate-container:
    name: Validate Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker build -t cluster-meter:ci .

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cluster-meter:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          timeout: 10m

  validate-kubernetes:
    name: Validate Kubernetes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate manifests
        run: kubectl apply --dry-run=client -f deploy/k8s/

  scan-security:
    name: Scan Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkov Kubernetes manifests
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: deploy/k8s/
          soft_fail: true

      - name: Checkov GitHub Actions workflows
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .github/workflows/
          soft_fail: true

  publish-container:
    name: Publish Container
    runs-on: ubuntu-latest
    needs:
      - validate-go
      - validate-container
      - validate-kubernetes
      - scan-security
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.CONTAINER_REGISTRY }}
          username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

  promote-gitops-manifest:
    name: Promote GitOps Manifest
    runs-on: ubuntu-latest
    needs: publish-container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Promote image in Kubernetes manifest
        uses: mikefarah/yq@v4.44.3
        env:
          IMAGE_TAG: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
        with:
          cmd: yq -i '.spec.template.spec.containers[0].image = strenv(IMAGE_TAG)' deploy/k8s/deployment.yaml

      - name: Commit promoted manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/deployment.yaml
          if git diff --cached --quiet; then
            echo "No manifest changes to commit"
          else
            git commit -m "ci: promote cluster-meter image sha-${{ github.sha }} [skip ci]"
            git push origin main
          fi
